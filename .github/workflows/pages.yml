name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir _site
          cp -a faah_diwali_prank/. _site/
          python - <<'PY'
          from pathlib import Path
          import re

          pattern = re.compile(r'''(["'`])/(assets|_astro|favicon\.svg)''')
          css_pattern = re.compile(r'''url\(/(assets|_astro|favicon\.svg)''')
          for path in Path("_site").rglob("*"):
              if path.is_file() and path.suffix in {".html", ".js", ".css", ".svg"}:
                  text = path.read_text()
                  text = pattern.sub(r"\1./\2", text)
                  text = css_pattern.sub(r"url(./\1", text)
                  path.write_text(text)
          PY
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
