<svg 
  xmlns="http://www.w3.org/2000/svg" 
  viewBox="0 0 1920 1080" 
  preserveAspectRatio="xMidYMid slice"
  class="temple-sunset-svg"
  id="temple-sunset-svg"
  aria-hidden="true"
>
  <defs>
    <!-- 1. Deep Night Sky Background -->
    <linearGradient id="twilightNightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#030205" />
      <stop offset="50%" stop-color="#060207" />
      <stop offset="80%" stop-color="#080309" />
      <stop offset="100%" stop-color="#040205" />
    </linearGradient>

    <!-- 2. Warm Left Sunset Atmosphere (Hanuman Ji and Mandir) -->
    <radialGradient id="leftSunsetAtmosphere" cx="20%" cy="66%" r="58%">
      <stop offset="0%" stop-color="#8a1c20" stop-opacity="0.55" />
      <stop offset="35%" stop-color="#601018" stop-opacity="0.38" />
      <stop offset="68%" stop-color="#2c060e" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#040206" stop-opacity="0" />
    </radialGradient>

    <!-- 3. Angled Seamless Horizon Red Dissolve (NO PATH BOUNDARY, NO CUTS, 100% SEAMLESS DISSOLVE) -->
    <!-- Slanted continuously so the horizon red is high on the left and slopes smoothly down low on the right -->
    <linearGradient id="angledDissolveGrad" x1="42%" y1="0%" x2="18%" y2="100%">
      <stop offset="0%" stop-color="#030205" stop-opacity="0" />
      <stop offset="58%" stop-color="#0a0309" stop-opacity="0" />
      <stop offset="68%" stop-color="#2e0813" stop-opacity="0.35" />
      <stop offset="78%" stop-color="#58121a" stop-opacity="0.65" />
      <stop offset="88%" stop-color="#761920" stop-opacity="0.88" />
      <stop offset="96%" stop-color="#460d16" stop-opacity="0.80" />
      <stop offset="100%" stop-color="#040205" stop-opacity="0.95" />
    </linearGradient>

    <!-- 4. Soft Drifting Twilight Clouds -->
    <linearGradient id="twilightCloudGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#78181b" stop-opacity="0.08" />
      <stop offset="50%" stop-color="#962420" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#4e0f1a" stop-opacity="0.04" />
    </linearGradient>
  </defs>

  <!-- 1. Deep Night Sky Base -->
  <rect width="1920" height="1080" fill="url(#twilightNightSky)" />

  <!-- 2. Volumetric Sunset Glow on Left (Hanuman Ji & Mandir) -->
  <rect width="1920" height="1080" fill="url(#leftSunsetAtmosphere)" />

  <!-- 3. Fullscreen Angled Dissolve (Completely seamless continuous color transition, zero sharp lines) -->
  <rect width="1920" height="1080" fill="url(#angledDissolveGrad)" />

  <!-- 4. Subtle Twilight Clouds -->
  <g class="twilight-clouds" opacity="0.40">
    <path d="M 980 380 Q 1160 360 1340 410 Q 1480 450 1620 460 Q 1520 480 1360 440 Q 1180 405 980 380 Z" fill="url(#twilightCloudGrad)" />
    <path d="M 580 520 Q 680 500 780 515 Q 840 535 800 550 Q 720 550 640 540 Q 570 535 580 520 Z" fill="url(#twilightCloudGrad)" />
  </g>

  <!-- 5. Ground Silhouette Base -->
  <rect x="0" y="1046" width="1920" height="34" fill="#000000" />
</svg>
